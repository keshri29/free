name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The blog section (src/app/blog, src/app/api) is a server-backed
      # feature (Medium sync, Redis/KV storage, ISR, live view tracking) and
      # cannot be part of a static export. It is only removed from this
      # ephemeral CI checkout so `next build` can produce a static site —
      # nothing is deleted from the repository itself. The full dynamic app,
      # blog included, keeps running wherever it's deployed today (e.g.
      # Vercel), unaffected by this workflow.
      - name: Strip server-only routes for static export
        run: rm -rf src/app/blog src/app/api

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://anuragkumar.dpdns.org
        run: npm run build

      - name: Verify export output
        run: test -d out && test -f out/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
